name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      # npm test's own pretest script runs `npm run build` first (tsc), so this step
      # covers both compiling and testing the compiled output — no separate build step.
      - name: Test
        run: npm test

      # worker-configuration.d.ts (Workers runtime types) is gitignored; generate it. Purely
      # local: reads wrangler.toml, no Cloudflare API call.
      - name: Generate Cloudflare Workers runtime types
        run: npm run cf-typegen

      # tsconfig.json excludes src/worker.ts from the npm build; tsconfig.worker.json checks
      # the whole src/ tree including the Worker entry.
      - name: Type check
        run: npm run type-check

      - name: Install 1Password CLI
        if: hashFiles('.op-secrets') != ''
        uses: 1password/install-cli-action@v1

      - name: Sync secrets from 1Password
        if: hashFiles('.op-secrets') != ''
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OP_VAULT: "ELC Automation"
        run: |
          set -euo pipefail
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%%#*}"
            line="$(echo "$line" | xargs)"
            [ -z "$line" ] && continue
            item="$(echo "$line" | awk '{print $1}')"
            cf="$(echo "$line" | awk '{print $2}')"
            [ -z "$cf" ] && cf="$item"
            if ! op read "op://${OP_VAULT}/${item}/credential" >/dev/null 2>&1; then
              echo "::error::${item} not readable in vault '${OP_VAULT}'"
              exit 1
            fi
            op read "op://${OP_VAULT}/${item}/credential" | npx wrangler secret put "$cf"
            echo "synced: ${item} -> ${cf}"
          done < .op-secrets

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Smoke check — tools/list
        run: |
          set -euo pipefail
          sleep 5
          # This host is stateless (createMcpHandler — a fresh McpServer per request, no
          # Durable Object), so it never issues an mcp-session-id and doesn't need one on
          # tools/list — unlike the other four MCP servers here.
          resp=$(curl -sf -X POST "https://mcp.elc-conference.io/mcp" \
            -H 'content-type: application/json' -H 'user-agent: deploy-verify' \
            -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
          echo "$resp" | grep -q '"get-started"' || { echo "::error::tools/list missing get-started"; exit 1; }
          echo "$resp" | grep -q '"quote_partnership"' || { echo "::error::tools/list missing quote_partnership"; exit 1; }
          echo "$resp" | grep -q '"get-attendee-perks"' || { echo "::error::tools/list missing get-attendee-perks"; exit 1; }
          # The same Worker serves the conference site's /mcp (docs page) and /mcp/info.
          curl -sf -o /dev/null "https://www.elc-conference.io/mcp" || { echo "::error::www /mcp docs page down"; exit 1; }
          # Capture first: `curl | grep -q` under pipefail fails on SIGPIPE when grep exits early.
          info=$(curl -sf "https://www.elc-conference.io/mcp/info")
          echo "$info" | grep -q '"quote_partnership"' || { echo "::error::/mcp/info missing tools"; exit 1; }
          echo "smoke check passed"
